[package]
name = "webui"
version = "0.1.0"
edition = "2024"

[dependencies]
ormlite = { version = "0.24.3", features = ["postgres", "uuid"]}
rocket = { version = "0.5.1", features = ["uuid", "json"]}
serde = "1.0.228"
serde_derive = "1.0.228"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"]}
uuid = { version = "1.19.0", features = ["serde", "v4"]}
openfab = { path = "../core", features = ["oidc"] }
ipp = "5.3.2"
rocket_okapi = { version = "0.9.0", features = ["swagger", "rapidoc"] }
rocket-oidc = { git = "https://github.com/vivianlazaras/rocket-oidc" }
tracing = "0.1.44"
openfab-drivers = { path = "../drivers" }
openfab-bambu = { path = "../drivers/bambu" }

livekit = { version = "0.7.32", optional = true }
rocket_dyn_templates = { version = "0.2.0", features = ["tera"]}
minio-rsc = "0.2.6"

secret_ref = { version = "0.1.0" }
rand = "0.9.2"
chrono = "0.4.45"
schemars = { version = "0.8", features = ["uuid1"]}
tera = "2.4.0"
serde_json = "1.0.151"
argon2 = "0.6.0"
rand_core = "0.10.1"
time = "0.3.55"
rocket_ws = "0.1.1"
[features]
livekit = [ "dep:livekit" ]
