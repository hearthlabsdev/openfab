[package]
name = "serverlib"
version = "0.1.0"
edition = "2024"

[dependencies]
minio-rsc = "0.2.6"
ormlite = { version = "0.25.0", features = ["postgres", "uuid"] }
percent-encoding = "2.3.2"
rocket = "0.5.1"
secret_ref = "0.1.1"
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.53.3"
uuid = { version = "1.28.0", features = ["serde", "v4"]}
openfab-drivers = { path = "../drivers" }
serde_derive = "1.0.229"
reqwest = "0.12.28"
argon2 = "0.6.0"
rocket-oidc = { git = "https://github.com/vivianlazaras/rocket-oidc", features = ["openapi"] }
openfab = { path = "../core", features = ["oidc"] }
tokio-utils = "0.1.2"
tokio-util = "0.7.20"
time = "0.3.55"
futures-util = "0.3.34"
rand = "0.9.2"
rand_core = "0.10.1"
rocket_okapi = { version = "0.9.0", features = ["swagger", "rapidoc", "uuid"]}
schemars = { version = "0.8", features = ["uuid1"] }
libm = "0.2.16"
hex = "0.4.3"
blake3 = "1.8.7"
sha2 = "0.11.1"
