[package]
name = "openfab"
version = "0.1.0"
edition = "2024"

[dependencies]
ipp = "5.3.2"
mdns-sd = "0.17.1"
serde = "1.0.228"
serde_derive = "1.0.228"
thiserror = "2.0.17"
uuid = "1.19.0"
http = "1.4.0"
tokio = { version = "1.48.0", features = ["full"] }
futures-io = "0.3.31"
futures-util = "0.3.31"
chrono = "0.4.42"
language-tags = "0.3.2"
serde_json = "1.0.145"
secret_ref = { version = "0.1.1" }
rocket-oidc = { path = "../../libraries/rocket_oidc", optional = true }
livekit = { version = "0.7.32", optional = true }
async-trait = "0.1.89"

[features]
oidc = [ "dep:rocket-oidc" ]
livekit = [ "dep:livekit" ]
