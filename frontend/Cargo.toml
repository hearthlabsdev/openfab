[package]
name = "openfabd"
version = "0.1.0"
edition = "2024"

[dependencies]
ormlite = { version = "0.24.3", features = ["postgres", "uuid"]}
rocket = "0.5.1"
serde = "1.0.228"
serde_derive = "1.0.228"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"]}
uuid = { version = "1.19.0", features = ["serde", "v4"]}
openfab = { path = "../openfab" }
ipp = "5.3.2"
rocket_okapi = "0.9.0"
rocket-oidc = { path = "../../../../libraries/rocket_oidc" }
tracing = "0.1.44"

livekit = { version = "0.7.32", optional = true }

[features]
livekit = [ "dep:livekit" ]